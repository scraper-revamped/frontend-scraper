<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Input</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }
        .search-container {
            max-width: 600px;
            margin: 50px auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .search-container h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333333;
        }
        .btn-light-red {
            background-color: #ef293a; 
            color: #fdfdfd;           
            border: 1px solid #f5c6cb; 
            width: 100%;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .btn-light-red:hover {
            background-color: #f5c6cb; /* Slightly darker red on hover */
            color: #721c24; 
        }
        .logout-button {
            background-color: #dc3545; /* Bootstrap Danger Color */
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            text-align: center;
            margin-top: 20px; 
            display: inline-block;
        }
        .logout-button:hover {
            background-color: #c82333; /* Darker Danger Color */
        }
        .alert {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="search-container">
        <h1>Keyword Search</h1>
        <form method="POST" enctype="multipart/form-data" action="/search">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="keywords_file" class="form-label">Upload Keywords File (CSV or Excel)</label>
                <input type="file" id="keywords_file" name="keywords_file" class="form-control">
            </div>
            <div class="mb-3">
                <label for="manual_keywords" class="form-label">Enter Keywords (comma-separated), make sure the spelling is correct </label>
                <input type="text" id="manual_keywords" name="manual_keywords" class="form-control">
            </div>
            <button type="submit" class="btn btn-light-red">Submit</button>
        </form>
        <div class="text-center">
            <a href="/logout" class="logout-button">Logout</a>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="mt-3">
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }}" role="alert">
                         {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        {% endwith %}
    </div>
    <!-- Bootstrap JS (Optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
