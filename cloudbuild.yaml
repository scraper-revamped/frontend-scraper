steps:
  # 1. Build
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/flask-frontend:$COMMIT_SHA', '.']

  # 2. Push
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/flask-frontend:$COMMIT_SHA']

  # 3. Deploy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'flask-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/flask-frontend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--service-account'
      - 'rfp-scraper@diagflow-438514.iam.gserviceaccount.com'
      - '--allow-unauthenticated'
      
      # Resources
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'

      - '--timeout'
      - '17m'
      
      # SECRETS (This pulls the value from Secret Manager)
      # Syntax: ENV_VAR_NAME=SECRET_NAME:VERSION
      - '--set-secrets'
      - 'USER_DATA=USER_DATA_JSON:latest'
      - 'EMAIL_PASSWORD=EMAIL_PASSWORD_KH:latest'

images:
  - 'gcr.io/$PROJECT_ID/flask-frontend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY